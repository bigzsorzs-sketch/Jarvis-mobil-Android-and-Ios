name: Publish Jarvis Android 0.2.44 verified signed TEST update
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-android-044-signed-test.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: jarvis-android-044-verified-signed-test
  cancel-in-progress: false
jobs:
  publish-signed-test:
    if: github.repository == 'bigzsorzs-sketch/Jarvis-mobil-Android-and-Ios' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: v0.2.44-signed-test.1
      EXPECTED_SIGNER: 955338795da61366091ed256b0f6b2a948b9aaf9d7771b022a65b88a94b2d86a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject unreviewed source changes, concurrent main changes and duplicate release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          # Publish only the audited exact main SHA, never an arbitrary tag or PR artifact.
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test ! -f android/app/src/main/java/ai/jarvis/mobile/JarvisAiSettings.kt
          if grep -Fq 'JarvisTool("AI-agy"' android/app/src/main/java/ai/jarvis/mobile/JarvisNavigation.kt; then
            echo "::error::Obsolete AI-agy menu returned"; exit 1
          fi
          grep -Fq 'JarvisAttachmentPreview(stagedAttachments)' android/app/src/main/java/ai/jarvis/mobile/JarvisHomeScreen.kt
          grep -Fq 'JarvisPendingTurn.isWaitingPlaceholder(answer)' android/app/src/main/java/ai/jarvis/mobile/JarvisHomeScreen.kt
          test -f server/src/mediaParts.ts && test -f server/src/chatStream.ts
          grep -F 'applicationId = "ai.jarvis.mobile"' android/app/build.gradle.kts
          grep -Fx '        versionCode = 55' android/app/build.gradle.kts
          grep -Fx '        versionName = "0.2.44"' android/app/build.gradle.kts
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)][0].id // empty')" || {
              echo "::error::Refusing to replace existing release"; exit 1;
            }
      - name: Wait for successful source unit, lint, APK and both emulator checks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            ready=1
            for workflow in android-debug.yml android-ui-emulator.yml; do
              state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" |
                jq -r --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
                  [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and
                    .head_repository.full_name == $repo and .event == "push")][0] |
                  if . == null then "pending"
                  elif .status != "completed" then "pending"
                  elif .conclusion == "success" then "success"
                  else "failed" end')"
              if [[ "$state" == "failed" ]]; then
                echo "::error::Required workflow failed: $workflow"; exit 1
              elif [[ "$state" != "success" ]]; then
                ready=0
              fi
            done
            if [[ "$ready" == 1 ]]; then
              echo "Both Android source checks passed at $SOURCE_SHA"
              exit 0
            fi
            echo "Waiting for pinned source checks ($attempt/30)"
            sleep 30
          done
          echo "::error::Pinned source Android checks did not complete successfully"
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify hosted backend before signing mobile candidate
        shell: bash
        run: |
          set -euo pipefail
          cd server
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK build tools 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore EXISTING protected Jarvis signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-upload.jks"
          test -s "$RUNNER_TEMP/jarvis-upload.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-upload.jks"
      - name: Re-run Kotlin tests, both lint modes and build signed release APK/AAB
        shell: bash
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          JARVIS_GATEWAY_ORIGIN: ${{ vars.JARVIS_GATEWAY_ORIGIN }}
        run: |
          set -euo pipefail
          test -s "$ANDROID_SIGNING_STORE_FILE"
          gradle -p android :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease :app:bundleRelease :app:lintPlay :app:assemblePlay :app:bundlePlay
      - name: Verify package, signed APK, previous-version signer and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          grep -F "package: name='ai.jarvis.mobile' versionCode='55' versionName='0.2.44'" "$RUNNER_TEMP/package.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/package.txt"
          unzip -t "$apk" >/dev/null
          # Jarvis uses its own established signing certificate; jarsigner -strict
          # returns status 4 for expected self-signed trust-chain warnings.
          # Verify the signed JAR cryptographically and require affirmative success.
          jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-verification.txt"
          grep -Fq "jar verified." "$RUNNER_TEMP/aab-verification.txt"
          signer="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/signature.txt" | awk '{print $NF}' | tr A-F a-f)"
          test "$signer" = "$EXPECTED_SIGNER" || { echo "::error::Jarvis signer mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v0.2.41-signed-test.1 --repo "$GITHUB_REPOSITORY" \
            --pattern SIGNING-CERTIFICATE.txt --dir "$RUNNER_TEMP/previous"
          previous="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' \
            "$RUNNER_TEMP/previous/SIGNING-CERTIFICATE.txt" | awk '{print $NF}' | tr A-F a-f)"
          test "$signer" = "$previous"
          mkdir -p dist
          cp "$apk" dist/Jarvis-Android-0.2.44-signed-test.apk
          cp "$RUNNER_TEMP/signature.txt" dist/SIGNING-CERTIFICATE.txt
          (cd dist && sha256sum Jarvis-Android-0.2.44-signed-test.apk > SHA256SUMS.txt && sha256sum --check --strict SHA256SUMS.txt)
      - name: Verify separately signed Play AAB and minimal permissions
        shell: bash
        run: |
          set -euo pipefail
          play_apk=android/app/build/outputs/apk/play/app-play.apk
          play_aab=android/app/build/outputs/bundle/play/app-play.aab
          test -s "$play_apk" && test -s "$play_aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$play_apk" > "$RUNNER_TEMP/play-signature.txt"
          grep -Fq "$EXPECTED_SIGNER" <(tr 'A-F' 'a-f' < "$RUNNER_TEMP/play-signature.txt")
          jarsigner -verify "$play_aab" > "$RUNNER_TEMP/play-verify.txt"
          grep -Fq "jar verified." "$RUNNER_TEMP/play-verify.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$play_apk" > "$RUNNER_TEMP/play-permissions.txt"
          for p in REQUEST_INSTALL_PACKAGES ACCESS_BACKGROUND_LOCATION SCHEDULE_EXACT_ALARM; do
            if grep -Fq "android.permission.$p" "$RUNNER_TEMP/play-permissions.txt"; then
              echo "::error::Restricted Play permission $p"; exit 1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$play_apk" AndroidManifest.xml > "$RUNNER_TEMP/play-manifest.txt"
          if grep -Fq "JarvisAccessibilityService" "$RUNNER_TEMP/play-manifest.txt"; then
            echo "::error::Accessibility service present in Play build"; exit 1
          fi
          mkdir -p dist/play
          cp "$play_aab" dist/play/Jarvis-Android-0.2.44-Play-upload.aab
          (cd dist/play && sha256sum Jarvis-Android-0.2.44-Play-upload.aab > PLAY-AAB-SHA256SUMS.txt)
      - name: Retain Play AAB for separate owner Play Console upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Jarvis-Android-0.2.44-Play-AAB-Owner-Review
          path: |
            dist/play/Jarvis-Android-0.2.44-Play-upload.aab
            dist/play/PLAY-AAB-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Create TEST prerelease as draft, not a general availability release
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # Jarvis Android 0.2.44 — aláírt TESZTFRISSÍTÉS

          **0.2.44 / versionCode 54**; Android csomag: **ai.jarvis.mobile**.
          **Ez TESZTkiadás, nem éles Google Play-verzió és nem teljesen tesztelt késztermék.**

          A korábbi 0.2.43-ra telepíthető Android tesztfrissítés:
          - A régi AI-agy menü és API-kulcsos beállítóoldal eltűnik, a
            korábban engedélyezett AI-kapcsolat és titkosított beállítások megmaradnak.
          - Maximum 10 kép előnézete és eltávolítása, automatikus képtömörítés
            és képenként maximum 128 MiB eredeti forrásból 20 MiB összes AI-adat.
          - Hálózati hiba után az eredeti fájlok megmaradnak újrapróbáláshoz.
          - AI-várakozó üzenet elrejtése, streaming a támogatott normál kérdésekhez,
            természetes parancs- és ébresztőértelmezés javítása.
          - Titkosított mentés/visszaállítás és opcionális saját szerveres
            visszakapcsolódás egyéni meghívóval, nem publikus közös API-kulccsal.
          - Megmaradnak az engedélyek és a telefonos végrehajtások ellenőrzései.

          **FONTOS:** a privát szerveres multimodális és streaming útvonal
          csak az új szerverkód tényleges telepítése után működik.
          Ez a kiadás nem bizonyítja a LIVE AI-szolgáltató és a képfeltöltés
          sikeres valós készülékes működését.
          A Play AAB továbbra is csak fejlesztői ellenőrzésre készül.
          A Play AAB külön GitHub Actions artifact, a Play Console
          regisztráció, Health Apps/Data Safety nyilatkozatok és a
          Google általi jóváhagyás külön követelmény.

          A Kotlin unit tesztek, debug/release lint, emulátorteszt, APK/AAB build,
          SHA-256 ellenőrzés és az előző Jarvis-verzióval egyező Android-aláírás
          kötelezőek a tesztkiadás közzététele előtt.

          **Valódi készülékes végponttól végpontig működési tesztek még hátravannak.**
          Ez nem nyilvános végleges termék.

          Telepítés: Jarvis → Beállítások → Frissítés keresése vagy az APK letöltése erről a GitHub tesztkiadási oldalról. **Ne töröld le a régi alkalmazást.** Androidon jóvá kell hagyni a telepítést.
          EOF
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" \
            dist/Jarvis-Android-0.2.44-signed-test.apk dist/SHA256SUMS.txt dist/SIGNING-CERTIFICATE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Jarvis Android 0.2.44 — aláírt TESZTFRISSÍTÉS" \
            --notes-file "$RUNNER_TEMP/notes.md" --draft --prerelease --latest=false
      - name: Verify ALL uploaded release files before publishing draft as prerelease
        shell: bash
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)][0].id // empty')"
          test -n "$id"
          digest="sha256:$(sha256sum dist/Jarvis-Android-0.2.44-signed-test.apk | awk '{print $1}')"
          sums="sha256:$(sha256sum dist/SHA256SUMS.txt | awk '{print $1}')"
          cert="sha256:$(sha256sum dist/SIGNING-CERTIFICATE.txt | awk '{print $1}')"
          size="$(stat --printf=%s dist/Jarvis-Android-0.2.44-signed-test.apk)"
          # Uploaded asset SHA-256 digests can be eventually consistent.
          # Do not publish until *all* GitHub metadata matches local bytes.
          ready=0
          for attempt in $(seq 1 15); do
            if
              gh api "repos/$GITHUB_REPOSITORY/releases/$id" |
            jq -e --arg tag "$RELEASE_TAG" --arg source "$SOURCE_SHA" --arg digest "$digest" \
              --arg sums "$sums" --arg cert "$cert" --argjson size "$size" '
                .tag_name == $tag and .target_commitish == $source and
                .draft == true and .prerelease == true and (.assets | length) == 3 and
                any(.assets[]; .name == "Jarvis-Android-0.2.44-signed-test.apk" and
                  .state == "uploaded" and .size == $size and .digest == $digest) and
                any(.assets[]; .name == "SHA256SUMS.txt" and .state == "uploaded" and .digest == $sums) and
                any(.assets[]; .name == "SIGNING-CERTIFICATE.txt" and .state == "uploaded" and .digest == $cert)
              ' >/dev/null
            then
              ready=1
              break
            fi
            echo "Waiting for asset SHA-256 propagation ($attempt/15)"
            sleep 8
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::Release asset digest verification did not pass"
            exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -F prerelease=true -f make_latest=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            jq -e --arg digest "$digest" '
              .draft == false and .prerelease == true and
              any(.assets[]; .name == "Jarvis-Android-0.2.44-signed-test.apk" and .digest == $digest)
              ' >/dev/null
      - name: Remove signing materials from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-upload.jks"
