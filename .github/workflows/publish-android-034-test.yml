name: Publish Jarvis Android 0.2.14 test APK
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read

jobs:
  publish-tested-apk:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm build commit is still main HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RUN_SHA"
      - name: Wait for successful UI emulator verification of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            conclusion="$(gh api "repos/${{ github.repository }}/actions/workflows/android-ui-emulator.yml/runs?head_sha=$RUN_SHA&event=push" --jq '.workflow_runs[0].conclusion // ""')"
            case "$conclusion" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required) exit 1 ;;
            esac
            sleep 10
          done
          echo "UI verification did not succeed in time."
          exit 1
      - name: Download exact successful Android build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Jarvis-Android-Debug-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk dist/Jarvis-Mobile-Android-0.2.14-test.apk
          sha256sum dist/Jarvis-Mobile-Android-0.2.14-test.apk > dist/SHA256SUMS.txt
      - name: Publish test-only GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RUN_SHA"
          tag="v0.2.14-dev-test.1"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Existing release kept intact."
            exit 0
          fi
          cat > /tmp/JARVIS_TEST_NOTES.md <<'EOF'
          ## Jarvis Mobile Android 0.2.14 – TESZT

          A telepítő a sikeres Kotlin-, Android Lint-, debug/release fordítás és az azonos commiton futó Android UI-emulátoros ellenőrzés után készül.

          - Privát meghívós Jarvis AI-béta: a tesztelők egyszer használatos meghívóval kapcsolódhatnak a saját HTTPS gatewayhez. Nincs OpenRouter API-kulcs az APK-ban.
          - A tesztelő 90 napos, visszavonható munkamenetet kap, amely helyben titkosítva tárolódik; mindenki külön szerveres kvótával rendelkezik.
          - Ha a GitHub repository változóban van JARVIS_GATEWAY_ORIGIN, Jarvis automatikusan megjeleníti a privát szerver eredetét. Enélkül a szerver HTTPS-címét külön kell megadni.
          - A tényleges közös AI-hozzáférés csak akkor működik, HA egy privát Jarvis szerver fut és a GitHub Secret oda biztonságosan telepítésre került. Az APK vagy a GitHub Secret önmagában nem indít szervert.
          - Nyilvános, korlátlan anonim regisztráció nem támogatott; a béta kizárólag meghívásos.
          - A 0.2.13-as főoldali chat, helyi titkosított előzmények, egyszeri főoldali parancsmező, beszéd és engedélyezett Android-műveletek megmaradnak.
          - Debug tesztkiadás. Ne töröld a korábbi appot a helyi csevegés adatainak mentése nélkül.
          EOF
          gh release create "$tag"             "dist/Jarvis-Mobile-Android-0.2.14-test.apk"             "dist/SHA256SUMS.txt"             --repo "${{ github.repository }}"             --target "$RUN_SHA"             --title "Jarvis Mobile Android 0.2.14 – TESZT"             --notes-file /tmp/JARVIS_TEST_NOTES.md             --prerelease             --latest=false

