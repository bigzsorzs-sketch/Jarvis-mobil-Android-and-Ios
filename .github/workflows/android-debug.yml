name: Build Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:
# An earlier commit in the same PR should not keep running costly emulator
# jobs while newer, different code is already awaiting validation. Main
# builds and manual release workflows are never cancelled by this rule.
concurrency:
  group: jarvis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Kotlin tests, debug and release lint, debug APK, and unsigned release smoke build
        shell: bash
        env:
          # Public HTTPS server origin, NOT the OpenRouter secret.
          JARVIS_GATEWAY_ORIGIN: ${{ vars.JARVIS_GATEWAY_ORIGIN }}
        run: |
          # The PR runner has no signing keys. Verify release compilation and
          # AAB creation without publishing unsigned artifacts as production.
          if ! gradle -p android :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace; then
            echo "::group::Android lint details"
            cat android/app/build/reports/lint-results-debug.txt 2>/dev/null || true
            cat android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-Lint-Report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
