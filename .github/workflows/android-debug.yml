name: Build Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:
# An earlier commit in the same PR should not keep running costly emulator
# jobs while newer, different code is already awaiting validation. Main
# builds and manual release workflows are never cancelled by this rule.
concurrency:
  group: jarvis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"
      - name: Run Kotlin tests, debug and release lint, debug APK, and unsigned release smoke build
        shell: bash
        env:
          # Public HTTPS server origin, NOT the OpenRouter secret.
          JARVIS_GATEWAY_ORIGIN: ${{ vars.JARVIS_GATEWAY_ORIGIN }}
        run: |
          # The PR runner has no signing keys. Verify release compilation and
          # AAB creation without publishing unsigned artifacts as production.
          if ! gradle -p android :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintPlay :app:assemblePlay :app:bundlePlay --stacktrace; then
            echo "::group::Android lint details"
            cat android/app/build/reports/lint-results-debug.txt 2>/dev/null || true
            cat android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Enforce restricted-permission exclusions in Play APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/play/app-play.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" > "$RUNNER_TEMP/play-permissions.txt"
          for permission in REQUEST_INSTALL_PACKAGES ACCESS_BACKGROUND_LOCATION SCHEDULE_EXACT_ALARM; do
            if grep -Fq "android.permission.$permission" "$RUNNER_TEMP/play-permissions.txt"; then
              echo "::error::Forbidden Play-only permission: $permission"
              exit 1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/play-manifest.txt"
          if grep -Fq '.JarvisAccessibilityService' "$RUNNER_TEMP/play-manifest.txt"; then
            echo "::error::AccessibilityService must not be declared in Play build"
            exit 1
          fi
          test -s android/app/build/outputs/bundle/play/app-play.aab
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Jarvis-Android-Lint-Report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Jarvis-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
