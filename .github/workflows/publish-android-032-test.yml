name: Publish Jarvis Android 0.2.12 test APK
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read

jobs:
  publish-tested-apk:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm build commit is still main HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RUN_SHA"
      - name: Wait for successful UI emulator verification of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            conclusion="$(gh api "repos/${{ github.repository }}/actions/workflows/android-ui-emulator.yml/runs?head_sha=$RUN_SHA&event=push" --jq '.workflow_runs[0].conclusion // ""')"
            case "$conclusion" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required) exit 1 ;;
            esac
            sleep 10
          done
          echo "UI verification did not succeed in time."
          exit 1
      - name: Download exact successful Android build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Jarvis-Android-Debug-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk dist/Jarvis-Mobile-Android-0.2.12-test.apk
          sha256sum dist/Jarvis-Mobile-Android-0.2.12-test.apk > dist/SHA256SUMS.txt
      - name: Publish test-only GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RUN_SHA"
          tag="v0.2.12-dev-test.1"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Existing release kept intact."
            exit 0
          fi
          cat > /tmp/JARVIS_TEST_NOTES.md <<'EOF'
          ## Jarvis Mobile Android 0.2.12 – TESZT

          A telepítő a sikeres Kotlin-, Android Lint-, debug/release fordítás és az azonos commiton futó Android UI-emulátoros ellenőrzés után készül.

          - Az általános szöveges kérdések OpenRouter-kérésében nincs 'tools' és 'tool_choice'; a csak szöveges modellvégpontokat nem szűri ki felesleges eszközhívás.
          - Kifejezett Android-műveletek esetén csak a kérésnek megfelelő, engedélyezett eszközdefiníció jelenhet meg; Android minden műveletet külön ellenőriz.
          - A kifejezett WhatsApp/Messenger-piszkozatok előkészítése mindig a telefonon történik, működő AI-kulcs mellett is, felhasználói jóváhagyással; semmi nem küldődik el automatikusan.
          - A saját Jarvis szerver szintén csak megfelelő parancsnál kér AI-eszközhívást, sima kérdésnél nem.
          - A nem támogatott banki vagy személyes app nevére adott parancs nem nyithat meg véletlenül egy hasonló nevű Jarvis-eszközt.
          - Az 0.2.12 automatizált tesztkiadás, nem Play Store release, és nem bizonyítja a személyes OpenRouter-fiókban a modell összes végpontjának elérhetőségét.
          - Az app telepítés előtti mentés fontos: eltérő debug-aláírás mellett frissítés helyett újratelepítésre lehet szükség, ami törölheti a titkosított helyi chatnaplót.
          EOF
          gh release create "$tag"             "dist/Jarvis-Mobile-Android-0.2.12-test.apk"             "dist/SHA256SUMS.txt"             --repo "${{ github.repository }}"             --target "$RUN_SHA"             --title "Jarvis Mobile Android 0.2.12 – TESZT"             --notes-file /tmp/JARVIS_TEST_NOTES.md             --prerelease             --latest=false

