name: Publish Jarvis Android 0.1.9 test prerelease
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-019-test.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-tested-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful pinned Android QA run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          outcome="$(gh api repos/${{ github.repository }}/actions/runs/38213137238 --jq .conclusion)"
          source_sha="$(gh api repos/${{ github.repository }}/actions/runs/38213137238 --jq .head_sha)"
          test "$outcome" = "success"
          test "$source_sha" = "5071e171a89b1d7de91754300c174b0a991df1f0"
      - name: Download approved APK artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 38213137238
          name: Jarvis-Android-Debug-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify APK archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk > /dev/null
          mv dist/app-debug.apk dist/Jarvis-Mobile-Android-0.1.9-test.apk
          sha256sum dist/Jarvis-Mobile-Android-0.1.9-test.apk | tee dist/SHA256SUMS.txt
      - name: Publish test-only GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.1.9-dev-test.1"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace existing assets."
            exit 1
          fi
          cat > /tmp/JARVIS_TEST_NOTES.md <<'EOF'
          ## Jarvis Mobile Android – tesztkiadás, nem végleges

          A Jarvis Mobile 0.1.9-dev APK a GitHub Actions **38213137238** sikeres tesztjéből származik.

          - A főoldali Munka kapcsoló helyett ismét oldalsó menü. Megnyitás: húzás vagy koppintás a Jarvis névre; nincs külön bal felső menügomb.
          - Rendszerállapot, Térkép és Fájlok és képek menüpont eltávolítva. A Navigáció és a főoldali + csatolás marad.
          - Jegyzetek: a telefon jegyzetalkalmazásának közvetlen megnyitása.
          - Letisztult, csoportosított Beállítások; valódi Android-engedélykérő ablakok. Különleges hozzáféréseknél az Android saját beállításoldala nyílik.
          - A „jó reggelt”, „szia”, „köszönöm” és más rövid köszönések már helyi választ kapnak, írásban és a hangvezérlésben is.
          - Rövidített, görgethető csatolási ablak; EXE csatolás és formátumfelismerés; Megnyitás gomb a fájlokhoz.
          - Hiányzó megnyitó esetén fájlformátumhoz tartozó alkalmazáskeresés. A keresés nem tartalmazza a dokumentum nevét vagy tartalmát, nem telepít automatikusan appot.
          - Megmarad a menthető világos/sötét téma, a beszédhez kötött gömbmozgás és a 20 kép / összesen 1 GiB csatolási korlát.

          A Kotlin-egységtesztek, az Android Lint és az APK-fordítás sikeresek a fenti forráscommiton.
          Fizikai telefonon ellenőrizni kell az új menüt, a jegyzetappot, az engedélyablakokat, a fájlmegnyitókat és a hangvezérlést.
          Az AI-agy még nincs bekötve, a csatolmányok helyben maradnak. Az EXE csatolása nem Windows-program futtatása Androidon; a keresés nem garantál kompatibilis appot.
          Eltérő debug-aláírás esetén a frissítés meghiúsulhat. A régi app eltávolítása törli a helyi adatokat; előbb mentsd, amit meg szeretnél tartani.

          A SHA256SUMS.txt az APK ellenőrzőösszegét tartalmazza.
          EOF
          gh release create "$tag" \
            "dist/Jarvis-Mobile-Android-0.1.9-test.apk" \
            "dist/SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --target "5071e171a89b1d7de91754300c174b0a991df1f0" \
            --title "Jarvis Mobile Android 0.1.9 – TESZT" \
            --notes-file /tmp/JARVIS_TEST_NOTES.md \
            --prerelease \
            --latest=false
