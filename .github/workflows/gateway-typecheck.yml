name: Check AI gateway development skeleton
on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/gateway-typecheck.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/gateway-typecheck.yml"
  workflow_dispatch:
# An earlier commit in the same PR should not keep running costly emulator
# jobs while newer, different code is already awaiting validation. Main
# builds and manual release workflows are never cancelled by this rule.
concurrency:
  group: jarvis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  gateway-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install development dependencies
        run: cd server && npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript strict type check
        run: cd server && npm run typecheck
      - name: Server AI tool-call regression tests
        run: cd server && npm test
      - name: Validate private HTTPS Docker deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          cd server
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet
