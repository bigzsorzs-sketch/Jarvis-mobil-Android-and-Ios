name: Publish Jarvis Android 0.2.16 test APK
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read

jobs:
  publish-tested-apk:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm build commit is still main HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RUN_SHA"
      - name: Wait for successful UI emulator verification of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            conclusion="$(gh api "repos/${{ github.repository }}/actions/workflows/android-ui-emulator.yml/runs?head_sha=$RUN_SHA&event=push" --jq '.workflow_runs[0].conclusion // ""')"
            case "$conclusion" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required) exit 1 ;;
            esac
            sleep 10
          done
          echo "UI verification did not succeed in time."
          exit 1
      - name: Download exact successful Android build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Jarvis-Android-Debug-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk dist/Jarvis-Mobile-Android-0.2.16-test.apk
          sha256sum dist/Jarvis-Mobile-Android-0.2.16-test.apk > dist/SHA256SUMS.txt
      - name: Publish test-only GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RUN_SHA"
          tag="v0.2.16-dev-test.1"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Existing release kept intact."
            exit 0
          fi
          cat > /tmp/JARVIS_TEST_NOTES.md <<'EOF'
          ## Jarvis Mobile Android 0.2.16 – EGYBEN TESZT

          Az Android 0.2.13 óta összes eddigi main fejlesztés + a 7 nyelvű számlázó fejlesztés egy APK-ban.
          A kiadás csak a sikeres Kotlin-tesztek, Android Lint, debug/release fordítás, és az azonos commiton futó Android-emulátoros UI-teszt után történik.

          - Teljes menü- és AI-válasznyelv-választás: magyar, angol, német, francia, spanyol, olasz, lengyel.
          - Vércukor: helyi napló, LibreView CSV-import, összesítés, hivatalos LibreLink NFC-átadás, engedélyezett Health Connect lekérdezés (nem közvetlen Abbott-szenzorprotokoll).
          - Új számlázás: ügyfelek és céges adatok helyi titkosított tárolása, számlák, ajánlatok, GBP/VAT mezők, PDF, fizetési státuszok.
          - Számlázási hangvezérlés és nyelvfüggő PDF. A felhasználó által kézzel rögzített ügyfeleknek közvetlen Gmail SMTP-küldés alkalmazásjelszóval; valódi fiókkal még ellenőrizni kell. SMTP-visszaigazolás nem garantál postaládába kézbesítést.
          - AI-agy: helyi, titkosított OpenRouter BYOK-kulcs, nem beágyazott megosztott API-kulcs. Korlátozott Android-parancsvégrehajtás, nem korlátlan más app vezérlés.
          - Ez DEBUG-ALÁÍRÁSÚ, ellenőrzött TESZT APK, nem végleges pénzügyi vagy orvostechnikai termék. Számlázási jogi/VAT-megfelelőség és élő Gmail-teszt szükséges.
          - MEGJEGYZÉS: a 0.2.13-dev verziót másik GitHub Actions gép írhatta alá. Ha Android szerint eltér az aláírás, a frissítés nem települ rá. MENTSD az alkalmazás adatait mielőtt eltávolítod: a törlés elveszítheti a titkosított jegyzeteket, chatet, ügyfeleket és egyéb adatokat. A régi titkosított adatok a régi app nélkül nem feltétlenül exportálhatók.
          EOF
          gh release create "$tag"             "dist/Jarvis-Mobile-Android-0.2.16-test.apk"             "dist/SHA256SUMS.txt"             --repo "${{ github.repository }}"             --target "$RUN_SHA"             --title "Jarvis Mobile Android 0.2.16 – TESZT"             --notes-file /tmp/JARVIS_TEST_NOTES.md             --prerelease             --latest=false

