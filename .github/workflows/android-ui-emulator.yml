name: Android Compose UI emulator smoke
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ui-emulator.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ui-emulator.yml"
permissions:
  contents: read
jobs:
  compose-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle -p android :app:connectedDebugAndroidTest --stacktrace

      - name: Upload emulator test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-UI-Test-Reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
