name: Build signed Android release candidate
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter QA_PASSED_AND_POLICY_REVIEWED after REAL device tests and privacy review"
        required: true
        type: string
permissions:
  contents: read

jobs:
  signed-candidate:
    # Never auto-publish or build production signatures from a PR or unreviewed tag.
    if: >-
      ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'QA_PASSED_AND_POLICY_REVIEWED' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"
      - name: Recover protected signing credentials
        shell: bash
        env:
          SIGNING_FILE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_FILE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_FILE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-upload.jks"
          test -s "$RUNNER_TEMP/jarvis-upload.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-upload.jks"
      - name: Run unit tests, release lint and build signed APK and AAB
        shell: bash
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          # This is only the public Jarvis server URL, never the provider key.
          JARVIS_GATEWAY_ORIGIN: ${{ vars.JARVIS_GATEWAY_ORIGIN }}
        run: |
          set -euo pipefail
          test -s "$ANDROID_SIGNING_STORE_FILE"
          # A signed release candidate cannot silently ship without its public gateway origin.
          # Unsigned PR smoke builds still deliberately allow an empty value.
          test -n "$JARVIS_GATEWAY_ORIGIN" || {
            echo "::error::Missing public Jarvis gateway origin for signed candidate"; exit 1;
          }
          gradle -p android :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease :app:lintPlay :app:assemblePlay :app:bundlePlay
      - name: Verify production target API and cryptographic signatures
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          play_apk=android/app/build/outputs/apk/play/app-play.apk
          play_aab=android/app/build/outputs/bundle/play/app-play.aab
          test -s "$play_apk" && test -s "$play_aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/github-cert.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$play_apk" > "$RUNNER_TEMP/play-cert.txt"
          jarsigner -verify "$aab" | grep -Fq 'jar verified.'
          jarsigner -verify "$play_aab" | grep -Fq 'jar verified.'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "targetSdkVersion:'36'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$play_apk" | grep "targetSdkVersion:'36'"
          # Refuse accidental new certificates and check Github/Play upload signer continuity.
          EXPECTED_SIGNER=955338795da61366091ed256b0f6b2a948b9aaf9d7771b022a65b88a94b2d86a
          github_signer="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/github-cert.txt" | awk '{print $NF}' | tr A-F a-f)"
          play_signer="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/play-cert.txt" | awk '{print $NF}' | tr A-F a-f)"
          test "$github_signer" = "$EXPECTED_SIGNER" && test "$play_signer" = "$EXPECTED_SIGNER" || {
            echo "::error::Android signing certificate changed, refusing candidate"; exit 1;
          }
          # Check actual signed Play package, not only the manifest source or an unsigned PR APK.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$play_apk" > "$RUNNER_TEMP/play-permissions.txt"
          for p in REQUEST_INSTALL_PACKAGES ACCESS_BACKGROUND_LOCATION SCHEDULE_EXACT_ALARM; do
            if grep -Fq "android.permission.$p" "$RUNNER_TEMP/play-permissions.txt"; then
              echo "::error::Forbidden permission in signed Play candidate: $p"; exit 1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$play_apk" AndroidManifest.xml > "$RUNNER_TEMP/play-manifest.txt"
          if grep -Fq 'JarvisAccessibilityService' "$RUNNER_TEMP/play-manifest.txt"; then
            echo "::error::Accessibility control may not ship in Play candidate"; exit 1
          fi
          unzip -t "$apk" >/dev/null
          unzip -t "$play_apk" >/dev/null
          mkdir -p dist
          cp "$apk" dist/Jarvis-Android-release-candidate.apk
          cp "$aab" dist/Jarvis-Android-release-candidate.aab
          cp "$play_aab" dist/Jarvis-Android-Play-owner-review.aab
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Upload private release-candidate artifacts (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Jarvis-Android-Signed-Release-Candidate
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Remove signing material from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-upload.jks"
