name: Publish signed Jarvis Android 0.2.20 update
on:
  # One-time publication request; only this tested workflow may change on top of the green Android source.
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-signed-test.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SIGNED_TEST_APPROVED to publish the 0.2.20 in-place signed update after CI verification'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: jarvis-android-signed-test
  cancel-in-progress: false
jobs:
  signed-test-apk:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       github.repository == 'bigzsorzs-sketch/Jarvis-mobil-Android-and-Ios') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'SIGNED_TEST_APPROVED')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify main commit and matching tested Android source before signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if gh release view "v0.2.20-signed-test.1" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Signed test release already exists; nothing to replace"
            exit 1
          fi
          TESTED_SHA="$SOURCE_SHA"
          # Manual dispatch can use the prior green Android commit only when
          # every intervening change affects THIS release workflow alone.
          baseline="b47d8e7be1241550781d563abb1708efe54cf644"
          if [ "$SOURCE_SHA" != "$baseline" ]; then
            comparison="$(gh api "repos/${{ github.repository }}/compare/$baseline...$SOURCE_SHA")"
            status="$(printf '%s' "$comparison" | jq -r '.status')"
            allowed="$(printf '%s' "$comparison" | jq -r '
              [.files[].filename] | if length == 0 then false
              else all(.[]; . == ".github/workflows/publish-android-signed-test.yml") end
            ')"
            if [ "$status" = "ahead" ] && [ "$allowed" = "true" ]; then
              TESTED_SHA="$baseline"
            fi
          fi
          # Require completed, successful main-branch build AND emulator tests
          # for the exact Android source being signed. No blind green claim.
          for workflow in android-debug.yml android-ui-emulator.yml; do
            verified=""
            for attempt in $(seq 1 90); do
              state="$(gh api "repos/${{ github.repository }}/actions/workflows/$workflow/runs?head_sha=$TESTED_SHA&event=push&per_page=10" | jq -r --arg sha "$TESTED_SHA" --arg repo "${{ github.repository }}" '
                [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and
                  .head_repository.full_name == $repo and .event == "push")][0] |
                    if . == null then "" else
                      if .status == "completed" then .conclusion // "" else "pending" end
                    end
              ')"
              case "$state" in
                success) verified=yes; break ;;
                failure|cancelled|timed_out|action_required|stale)
                  echo "::error::Required $workflow failed: $state"; exit 1 ;;
              esac
              sleep 10
            done
            test "$verified" = yes || { echo "::error::Required verified $workflow is not green"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore permanent protected signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing permanent Jarvis signing keystore secret'; exit 1; }
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing Android signing credentials'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-upload.jks"
          test -s "$RUNNER_TEMP/jarvis-upload.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-upload.jks"
      - name: Run Android unit tests, release lint and assemble signed APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          JARVIS_GATEWAY_ORIGIN: ''
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Cryptographically verify APK, version and integrity
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/new-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='ai.jarvis.mobile' versionCode='31' versionName='0.2.20'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "targetSdkVersion:'36'"
          unzip -t "$apk" > /dev/null
          mkdir -p dist
          cp "$apk" dist/Jarvis-Android-0.2.20-signed-test.apk
          cp "$RUNNER_TEMP/new-signature.txt" dist/SIGNING-CERTIFICATE.txt
          (cd dist && sha256sum Jarvis-Android-0.2.20-signed-test.apk > SHA256SUMS.txt)
      - name: Verify permanent signature exactly matches installed 0.2.18 baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # This must install IN PLACE over the user's permanently signed 0.2.18.
          # Keep the original Jarvis production signing identity forever.
          current="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' \
            dist/SIGNING-CERTIFICATE.txt | awk '{print $NF}' | tr 'A-F' 'a-f')"
          test "${#current}" -eq 64 || { echo "::error::No valid signing certificate fingerprint"; exit 1; }
          expected="955338795da61366091ed256b0f6b2a948b9aaf9d7771b022a65b88a94b2d86a"
          test "$current" = "$expected" || { echo "::error::Wrong permanent Jarvis 0.2.18 signing certificate"; exit 1; }
          echo "Permanent Jarvis signing identity verified against the saved baseline."
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v0.2.19-signed-test.1 \
            --repo "${{ github.repository }}" --pattern SIGNING-CERTIFICATE.txt \
            --dir "$RUNNER_TEMP/previous"
          previous="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' \
            "$RUNNER_TEMP/previous/SIGNING-CERTIFICATE.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')"
          test "$previous" = "$expected" || {
            echo "::error::New APK signer differs from 0.2.18; refusing unsafe update"; exit 1;
          }
          echo "Same signing identity as already published 0.2.18 confirmed."
      - name: Publish signed APK as clearly labeled prerelease (NOT public AI launch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          tag=v0.2.20-signed-test.1
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo 'Signed-test release already exists; refusing to replace it'
            exit 1
          fi
          cat > "$RUNNER_TEMP/jarvis-signed-test-notes.md" <<'EOF'
          # Jarvis Android 0.2.20 — SIGNED IN-PLACE UPDATE
          Signed version 0.2.20 / versionCode 31 / package ai.jarvis.mobile.
          This is an upgrade from the existing permanently signed Jarvis 0.2.18/0.2.19.
          Text AI is fixed to OpenRouter openai/gpt-5.2; direct OpenRouter API key is stored locally, not included in the APK.
          Real spoken audio is generated by a separate OpenRouter TTS-capable speech model; GPT-5.2 itself does NOT synthesize MP3.
          A plain AI request does not unnecessarily force web search, while live research requests may use the supported OpenRouter web tool.
          Voice: the main blue microphone starts hands-free, multi-turn listening that stays open until the user stops it or Android terminates the service. No separate read-aloud button on the chat timeline.
          Navigation: "Nyisd meg a térképet és navigálj Harrogate-be", "Vigyél Leedsbe" and multilingual supported destination commands are prioritized over generic Maps opening.
          Destination is sent to Google Maps' documented turn-by-turn navigation intent with driving mode when Maps is available.
          Android/Google Maps may still require location permission, foreground activity or user action; no guarantee of uninterrupted background map control.
          Contacts, confirmed calls, other local commands and the self-update panel remain included.
          The in-app updater verifies SHA256, increasing versionCode, same Android package and exact installed signing certificate before invoking Android's system installer.
          The signature fingerprint MUST match the fixed Jarvis 0.2.18/0.2.19 signing identity. User must approve installation; do NOT uninstall to update.
          This build runs Kotlin unit tests, release lint, emulator UI smoke and signing checks. Real OpenRouter responses, audio and physical-device Google Maps still need on-device validation.
          This is a signed controlled pre-release, not a claim that every service is production certified.
          GitHub sideloading may trigger Xiaomi Mi Protect / Google Play Protect source warnings; never disable device protection to install.
          EOF
          gh release create "$tag" \
            dist/Jarvis-Android-0.2.20-signed-test.apk dist/SHA256SUMS.txt dist/SIGNING-CERTIFICATE.txt \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" \
            --title 'Jarvis Android 0.2.20 — signed UPDATE' \
            --notes-file "$RUNNER_TEMP/jarvis-signed-test-notes.md" --prerelease --latest=false
      - name: Securely remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-upload.jks"
