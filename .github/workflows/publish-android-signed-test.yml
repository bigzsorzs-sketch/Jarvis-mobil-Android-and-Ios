name: Publish signed Jarvis Android APK (no AI server)
on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SIGNED_TEST_APPROVED to build a signed TEST APK without the hosted AI gateway'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: jarvis-android-signed-test
  cancel-in-progress: false
jobs:
  signed-test-apk:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'SIGNED_TEST_APPROVED') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact main commit and same-commit emulator before signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_KIND: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if gh release view "v0.2.15-signed-test.1" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Signed test release already exists; nothing to replace"
            exit 1
          fi
          if [ "$RUN_KIND" = "workflow_run" ]; then
            for attempt in $(seq 1 45); do
              state="$(gh api "repos/${{ github.repository }}/actions/workflows/android-ui-emulator.yml/runs?head_sha=$SOURCE_SHA&event=push" --jq '.workflow_runs[0].conclusion // ""')"
              case "$state" in
                success) break ;;
                failure|cancelled|timed_out|action_required) echo "Emulator check failed"; exit 1 ;;
              esac
              if [ "$attempt" = "45" ]; then echo "Emulator check unavailable"; exit 1; fi
              sleep 10
            done
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore EXISTING protected signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing existing upload keystore secret'; exit 1; }
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing Android signing credentials'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-upload.jks"
          test -s "$RUNNER_TEMP/jarvis-upload.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-upload.jks"
      - name: Run Android unit tests, release lint and assemble signed APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          JARVIS_GATEWAY_ORIGIN: ''
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Cryptographically verify APK, version and integrity
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "versionName='0.2.15'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "targetSdkVersion:'36'"
          unzip -t "$apk" > /dev/null
          mkdir -p dist
          cp "$apk" dist/Jarvis-Android-0.2.15-signed-test.apk
          (cd dist && sha256sum Jarvis-Android-0.2.15-signed-test.apk > SHA256SUMS.txt)
      - name: Publish signed APK as clearly labeled prerelease (NOT public AI launch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          tag=v0.2.15-signed-test.1
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo 'Signed-test release already exists; refusing to replace it'
            exit 1
          fi
          cat > "$RUNNER_TEMP/jarvis-signed-test-notes.md" <<'EOF'
          # Jarvis Android 0.2.15 — SIGNED TEST APK
          This APK is built with the configured production signing keystore and its signature is verified in CI.
          This is a PRE-RELEASE for controlled testing, not a verified full AI-service/public launch.
          The Jarvis hosted AI gateway is NOT bundled or connected. Hosted AI requests need a future
          HTTPS gateway deployment. Direct OpenRouter mode is AVAILABLE in this signed APK:
          enter your own OpenRouter API key in Settings → AI brain and give explicit cloud consent.
          The key is encrypted locally using Android Keystore; no shared key is embedded in this APK.
          AI model availability and provider errors depend on your OpenRouter account.
          Installing from GitHub may still show Android unknown-source or Play Protect warnings.
          Before replacing a debug-signed installation, back up conversations and app data:
          a different signing key may require uninstalling the earlier build.
          EOF
          gh release create "$tag" \
            dist/Jarvis-Android-0.2.15-signed-test.apk dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" \
            --title 'Jarvis Android 0.2.15 — signed TEST APK' \
            --notes-file "$RUNNER_TEMP/jarvis-signed-test-notes.md" --prerelease --latest=false
      - name: Securely remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-upload.jks"
