name: Publish signed Jarvis Android APK (no AI server)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SIGNED_TEST_APPROVED to build a signed TEST APK without the hosted AI gateway'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: jarvis-android-signed-test
  cancel-in-progress: false
jobs:
  signed-test-apk:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'SIGNED_TEST_APPROVED') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify main commit and matching tested Android source before signing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if gh release view "v0.2.18-signed-test.1" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Signed test release already exists; nothing to replace"
            exit 1
          fi
          TESTED_SHA="$SOURCE_SHA"
          # Manual dispatch can use the prior green Android commit only when
          # every intervening change affects THIS release workflow alone.
          baseline="d47f0e1d644d51d501fd5a382210d3fe91790946"
          if [ "$SOURCE_SHA" != "$baseline" ]; then
            comparison="$(gh api "repos/${{ github.repository }}/compare/$baseline...$SOURCE_SHA")"
            status="$(printf '%s' "$comparison" | jq -r '.status')"
            changed="$(printf '%s' "$comparison" | jq -r '[.files[].filename] | join(",")')"
            if [ "$status" = "ahead" ] && [ "$changed" = ".github/workflows/publish-android-signed-test.yml" ]; then
              TESTED_SHA="$baseline"
            fi
          fi
          # Require completed, successful main-branch build AND emulator tests
          # for the exact Android source being signed. No blind green claim.
          for workflow in android-debug.yml android-ui-emulator.yml; do
            state="$(gh api "repos/${{ github.repository }}/actions/workflows/$workflow/runs?head_sha=$TESTED_SHA&event=push&per_page=10" | jq -r --arg sha "$TESTED_SHA" --arg repo "${{ github.repository }}" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and
                .head_repository.full_name == $repo and .event == "push" and .status == "completed")][0].conclusion // ""
            ')"
            test "$state" = "success" || { echo "Required verified $workflow status is not success: $state"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore EXISTING protected signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing existing upload keystore secret'; exit 1; }
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing Android signing credentials'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-upload.jks"
          test -s "$RUNNER_TEMP/jarvis-upload.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-upload.jks"
      - name: Run Android unit tests, release lint and assemble signed APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          JARVIS_GATEWAY_ORIGIN: ''
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Cryptographically verify APK, version and integrity
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/new-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='ai.jarvis.mobile' versionCode='29' versionName='0.2.18'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "targetSdkVersion:'36'"
          unzip -t "$apk" > /dev/null
          mkdir -p dist
          cp "$apk" dist/Jarvis-Android-0.2.18-signed-test.apk
          cp "$RUNNER_TEMP/new-signature.txt" dist/SIGNING-CERTIFICATE.txt
          (cd dist && sha256sum Jarvis-Android-0.2.18-signed-test.apk > SHA256SUMS.txt)
      - name: Verify signing identity MATCHES prior in-app upgrade APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # This gate deliberately refuses to claim a seamless update unless
          # the new APK has exactly the certificate from the prior public build.
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v0.2.17-dev-test.1 \
            --repo "${{ github.repository }}" \
            --pattern SIGNING-CERTIFICATE.txt \
            --dir "$RUNNER_TEMP/previous"
          old="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' \
            "$RUNNER_TEMP/previous/SIGNING-CERTIFICATE.txt" | awk '{print $NF}' | tr 'A-F' 'a-f')"
          current="$(grep -iE 'Signer #1 certificate SHA-256 digest: [0-9a-f]{64}' \
            dist/SIGNING-CERTIFICATE.txt | awk '{print $NF}' | tr 'A-F' 'a-f')"
          test "${#old}" -eq 64 && test "${#current}" -eq 64
          if [ "$old" != "$current" ]; then
            echo "::error::The protected signing key differs from the previous 0.2.17 APK. This cannot be published as an in-place update."
            exit 1
          fi
          echo "Same APK signing certificate confirmed; installer will independently verify the installed app signature."
      - name: Publish signed APK as clearly labeled prerelease (NOT public AI launch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          tag=v0.2.18-signed-test.1
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo 'Signed-test release already exists; refusing to replace it'
            exit 1
          fi
          cat > "$RUNNER_TEMP/jarvis-signed-test-notes.md" <<'EOF'
          # Jarvis Android 0.2.18 — SIGNED TEST APK
          This APK is built only when the existing protected keystore exactly matches the previous published 0.2.17 signing certificate. Signature, versionCode, package name, checksum and Android build are validated in CI.
          This is a PRE-RELEASE for controlled testing, not a verified full AI-service/public launch.
          The Jarvis hosted AI gateway is NOT bundled or connected. Hosted AI requests need a future
          HTTPS gateway deployment. Direct OpenRouter mode is AVAILABLE in this signed APK:
          enter your own OpenRouter API key in Settings → AI brain and give explicit cloud consent.
          The key is encrypted locally using Android Keystore; no shared key is embedded in this APK.
          AI model availability and provider errors depend on your OpenRouter account.
          Installing from GitHub may still show Android unknown-source or Play Protect warnings.
          This release is blocked when the old and new signing certificates differ.
          Never uninstall the previous Jarvis just to force an update: encrypted local
          conversations, readings, billing records and settings may be lost.
          EOF
          gh release create "$tag" \
            dist/Jarvis-Android-0.2.18-signed-test.apk dist/SHA256SUMS.txt dist/SIGNING-CERTIFICATE.txt \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" \
            --title 'Jarvis Android 0.2.18 — signed TEST APK' \
            --notes-file "$RUNNER_TEMP/jarvis-signed-test-notes.md" --prerelease --latest=false
      - name: Securely remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-upload.jks"
