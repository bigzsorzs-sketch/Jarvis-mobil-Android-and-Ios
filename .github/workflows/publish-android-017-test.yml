name: Publish Jarvis Android 0.1.7 test prerelease
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-017-test.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-tested-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful pinned Android QA run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          outcome="$(gh api repos/${{ github.repository }}/actions/runs/38181711041 --jq .conclusion)"
          source_sha="$(gh api repos/${{ github.repository }}/actions/runs/38181711041 --jq .head_sha)"
          test "$outcome" = "success"
          test "$source_sha" = "9e31988bafb889a01d7e4f4e441ade41c80eb503"
      - name: Download approved APK artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 38181711041
          name: Jarvis-Android-Debug-APK
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify APK archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk > /dev/null
          mv dist/app-debug.apk dist/Jarvis-Mobile-Android-0.1.7-test.apk
          sha256sum dist/Jarvis-Mobile-Android-0.1.7-test.apk | tee dist/SHA256SUMS.txt
      - name: Publish test-only GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.1.7-dev-test.1"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace existing assets."
            exit 1
          fi
          cat > /tmp/JARVIS_TEST_NOTES.md <<'EOF'
          ## Jarvis Mobile Android – tesztkiadás, nem végleges

          A Jarvis Mobile 0.1.7-dev APK a GitHub Actions **38181711041** sikeres tesztjéből származik.

          - Letisztult fehér-kék főoldal, központi animált kék gömb, mozgó fényhullámok, beszéd- és mikrofonvezérelt pulzálás.
          - Bal felső kétvonalas eszközmenü, alsó szöveges/hangos vezérlés.
          - Helyi hangparancsok, névjegyek és becenevek, térképes útvonal, béta ébresztő, üzenet-előkészítés.
          - **Még nem működik:** éles AI-agy, automatikus Gmail és UC Journal hozzáférés, teljes automatikus WhatsApp/Messenger küldés.
          - Android debug APK: az ébresztést, a háttérmikrofont, a hangszinkront és az engedélyeket fizikai telefonon kell ellenőrizni. Nem Play Store-kiadás.
          - Eltérő debug-aláírás esetén a régi változat frissítése meghiúsulhat. **Eltávolítás előtt mentsd az app helyi adatait**, mert törlésükkel elveszhetnek.
          - Próbaalkalmazásba éles jelszót, szolgáltatói API-kulcsot vagy érzékeny adatot ne adj meg.

          A SHA256SUMS.txt az APK ellenőrzőösszegét tartalmazza.
          EOF
          gh release create "$tag" \
            "dist/Jarvis-Mobile-Android-0.1.7-test.apk" \
            "dist/SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --target "9e31988bafb889a01d7e4f4e441ade41c80eb503" \
            --title "Jarvis Mobile Android 0.1.7 – TESZT" \
            --notes-file /tmp/JARVIS_TEST_NOTES.md \
            --prerelease \
            --latest=false
