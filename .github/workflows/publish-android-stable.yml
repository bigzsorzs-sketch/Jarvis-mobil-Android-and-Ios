name: Publish signed Jarvis Android release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm real-device QA, privacy/policy review and LIVE gateway verification: RELEASE_APPROVED"
        required: true
        type: string
permissions:
  contents: write
jobs:
  signed-release:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE_APPROVED'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify gateway server tests
        run: cd server && npm install --no-audit --no-fund && npm test
      - name: Verify LIVE HTTPS gateway and a real authorized AI reply
        env:
          PUBLIC_ORIGIN: ${{ vars.JARVIS_GATEWAY_ORIGIN }}
          TESTER_TOKEN: ${{ secrets.JARVIS_RELEASE_SMOKE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error
          base = os.environ.get("PUBLIC_ORIGIN", "").rstrip("/")
          token = os.environ.get("TESTER_TOKEN", "")
          if not re.fullmatch(r"https://[A-Za-z0-9.-]+(?::[0-9]{2,5})?", base):
              raise SystemExit("Missing/invalid production Jarvis HTTPS origin")
          if ".example" in base or "localhost" in base or "127.0.0.1" in base:
              raise SystemExit("Placeholder origin cannot be released")
          if not re.fullmatch(r"[0-9a-fA-F]{64}", token):
              raise SystemExit("Missing independent release smoke-test beta session secret")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(NoRedirect())
          health = opener.open(base+"/health", timeout=12)
          with health:
              if json.loads(health.read(4000)).get("status") != "ok":
                  raise SystemExit("Jarvis gateway not healthy")
          req = urllib.request.Request(base+"/v1/chat",
              data=json.dumps({"message":"Szia! Válaszolj egy rövid magyar mondattal."}).encode(),
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},
              method="POST")
          with opener.open(req, timeout=40) as resp:
              if resp.status != 200: raise SystemExit("Jarvis AI smoke check failed")
              answer=json.loads(resp.read(32000))
          if answer.get("ai") is not True or not isinstance(answer.get("reply"),str) or not answer["reply"].strip():
              raise SystemExit("Invalid LIVE Jarvis AI reply")
          print("Authenticated HTTPS Jarvis AI reply verified; no answer text or credential logged")
          PY
      - name: Recover protected app signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-upload.jks"
          test -s "$RUNNER_TEMP/jarvis-upload.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-upload.jks"
      - name: Build and test production-signed APK and AAB
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          JARVIS_GATEWAY_ORIGIN: ${{ vars.JARVIS_GATEWAY_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify signature, version and artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          jarsigner -verify -strict "$aab" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "versionName='0.2.14'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "targetSdkVersion:'36'"
          unzip -t "$apk" >/dev/null
          mkdir -p dist
          cp "$apk" dist/Jarvis-Android-0.2.14.apk
          cp "$aab" dist/Jarvis-Android-0.2.14.aab
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Publish real signed Jarvis 0.2.14 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          if gh release view "v0.2.14" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v0.2.14 already exists; do not overwrite"
            exit 1
          fi
          cat > "$RUNNER_TEMP/jarvis-release-notes.md" <<'EOF'
          # Jarvis Android 0.2.14
          Signed Android release with verified gateway connectivity at publication.
          Jarvis AI runs through a private HTTPS server; an OpenRouter provider key
          is NEVER placed in the APK. Access is by separately approved one-use
          invitations and is not anonymous/unlimited.
          Telegram/WhatsApp/Messenger external app actions remain subject to Android
          permissions and user confirmation.
          The app keeps encrypted local conversations and a scrollable Home timeline.
          Always back up local app data before uninstalling: a debug-signed APK may
          not be upgradeable in-place to the release signing identity.
          EOF
          gh release create v0.2.14 \
            dist/Jarvis-Android-0.2.14.apk dist/Jarvis-Android-0.2.14.aab dist/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" \
            --title "Jarvis Android 0.2.14" --notes-file "$RUNNER_TEMP/jarvis-release-notes.md" --latest
      - name: Securely remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-upload.jks"
